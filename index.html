<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNCHAINED | Record Label & Event Series</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/main.js" defer></script>
    <link rel="preconnect" href="https://docs.google.com">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="images/white.png" alt="UNCHAINED">
        </a>
        
        <button class="nav-toggle" aria-label="toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="label.html">Label</a>
            <a href="events.html">Events</a>
            <a href="artists.html">Artists</a>
            <a href="https://mojimusic.shop/" target="_blank" rel="noopener noreferrer">Merch</a>
            <a href="contact.html">Contact</a>
            <a href="label.html#demo-submission" class="btn btn-nav">SUBMIT DEMO</a>
        </div>
    </nav>

    <header class="hero">
        <video autoplay muted loop playsinline class="hero-video-bg" id="heroVideo" preload="auto">
            <source src="video.mp4" type="video/mp4">
        </video> 
        
        <div class="hero-content">
            <img src="images/logo.png" class="hero-logo" alt="UNCHAINED">
            <p>Record Label & Event Series</p>
            <a href="events.html" class="btn">Latest Events</a>
        </div>
    </header>

    <section id="latest-news">
        <h2 class="section-title">Latest from the Underground</h2>
        <div class="release-grid" id="home-updates">
            <p>Loading latest updates...</p>
        </div>
    </section>

    <footer>
        <div class="socials">
            <a href="https://soundcloud.com/mojimusicxx" target="_blank"><i class="fab fa-soundcloud"></i></a>
            <a href="https://www.youtube.com/@Unchainedlabel" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
        <p>&copy; 2026 UNCHAINED RECORDINGS. ALL RIGHTS RESERVED.</p>
        
        <p style="font-size: 0.75rem; color: #555; margin-top: 8px; letter-spacing: 1px;">
            BUILT BY <a href="https://alexroper.dev" target="_blank" rel="noopener noreferrer" style="color: #888; text-decoration: none; border-bottom: 1px dotted #555; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'">ALEX ROPER</a>
        </p>
    </footer>

    <script>
        const video = document.getElementById('heroVideo');

        // Test if video autoplay works out of the box
        video.play().catch(error => {
            // Check specifically for user engine blocks (Low Power Mode)
            if (error.name === 'NotAllowedError' || error.name === 'AbortError') {
                console.log("Low power configuration active. Deploying silent looping asset.");
                
                // Build an image fallback pointing directly to your new custom loop
                const fallbackImg = document.createElement('img');
                fallbackImg.src = 'css/video_fallback.gif'; 
                
                // Keep classes and positions inline
                fallbackImg.className = video.className;
                fallbackImg.style.cssText = video.style.cssText;
                
                // Swap the layout blocks immediately
                video.parentNode.replaceChild(fallbackImg, video);
            }
        });
    </script>
</body>
</html>

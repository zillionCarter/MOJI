<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABEL | UNCHAINED</title>
    <link rel="stylesheet" href="css/style.css?v=20260530-3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/main.js?v=20260530-3" defer></script>
    <link rel="preconnect" href="https://docs.google.com">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="images/white.png" alt="UNCHAINED">
        </a>
        <button class="nav-toggle" aria-label="toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="label.html">Label</a>
            <a href="events.html">Events</a>
            <a href="artists.html">Artists</a>
            <a href="https://mojimusic.shop/" target="_blank" rel="noopener noreferrer">Merch</a>
            <a href="contact.html">Contact</a>
            <a href="#demo-submission" class="btn btn-nav">SUBMIT DEMO</a>
        </div>
    </nav>

    <main class="snap-container">
        
        <section id="releases" class="full-screen-section">
            <div class="section-content">
                <h2 class="section-title">Releases</h2>
                <div class="release-grid" id="release-container">
                    <p>Loading Releases...</p>
                </div>
            </div>
        </section>

        <section id="demo-submission" class="full-screen-section alternate-bg">
            <div class="section-content">
                <div class="form-container">
                    <h2 class="section-title">Demo Submission</h2>
                    <p style="margin-bottom: 30px;">We are always looking for new talent. Send us your best unreleased tracks (Soundcloud links only).</p>
                    
                    <form action="https://formspree.io/f/xgorlqow" method="POST">
                        <div class="form-group">
                            <label>Artist Name</label>
                            <input type="text" name="artist_name" placeholder="Your DJ name" required>
                        </div>
                    
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" placeholder="email@example.com" required>
                        </div>
                    
                        <div class="form-group">
                            <label>Soundcloud Link</label>
                            <input type="url" name="soundcloud_link" placeholder="https://soundcloud.com/..." required>
                        </div>
                    
                        <div class="form-group">
                            <label>Message</label>
                            <textarea name="message" rows="4" placeholder="Tell us about yourself" required></textarea>
                        </div>
                    
                        <input type="hidden" name="_subject" value="New Demo Submission from UNCHAINED Site">
                    
                        <button type="submit" class="btn">Submit Demo</button>
                    </form>
                </div>
            </div>
        </section>

         <footer>
    <div class="socials">
        <a href="https://soundcloud.com/mojimusicxx" target="_blank"><i class="fab fa-soundcloud"></i></a>
        <a href="https://www.youtube.com/@Unchainedlabel" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>
    <p>&copy; 2026 UNCHAINED RECORDINGS. ALL RIGHTS RESERVED.</p>

</p>
</footer>
    </main>

</body>
</html>
